[package]
name = "quickfix-msgkrx"
version = "0.4.1"
authors = ["Arthur LE MOIGNE", "Giang Nguyen"]
edition = "2021"
description = "FIX 4.4 messages for the KRX (HOSE/HNX) dictionary, generated from FIX44KRX.xml"
repository = "https://github.com/gianghn/quickfix-rs"
license = "MIT OR Apache-1.1"
keywords = ["quickfix", "fix-protocol", "finance", "auto-generated"]
categories = ["encoding"]
rust-version = "1.86.0"
publish = false

[dependencies]
quickfix = { path = "../quickfix", version = "0.4.1" }

[build-dependencies]
quickfix-msg-gen = { path = "../quickfix-msg-gen", version = "0.4.1" }
