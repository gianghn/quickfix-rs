# KRX fork CI for krx/main (the integration branch the KRX gateway vendors) and its topic
# branches. Upstream's ci.yml and coverage.yml stay on main. libquickfix is our fork
# gianghn/quickfix (krx/main); see KRX_FORK_NOTES.md here and there.
name: KRX fork CI
on:
  push:
    branches: ["krx/**"]
  pull_request:
    branches: ["krx/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Parallel again: test_session.rs now holds GLOBAL_LOCK like the other session tests.
      # MultiThreaded is no longer behind a feature, so the default build tests both kinds.
      - name: Tests
        run: cargo test --workspace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # No -D warnings: upstream's tests and examples carry clippy warnings we don't patch.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

  # Most go-live P0s are memory or thread bugs that plain `cargo test` cannot see.
  # Tests in scripts/san-known-red.txt are open items and skipped (KRX_BUILD_PLAN.md, D4).
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # TSan is report-only until the C++ pin fixes FIX::Mutex's racy recursion (KRX_BUILD_PLAN.md, D6).
    continue-on-error: ${{ matrix.sanitizer == 'thread' }}
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # rustfmt: the message crates' build scripts format the generated code.
          components: rust-src, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: san-${{ matrix.sanitizer }}
      # clang's sanitizer runtimes for the C++ side, and llvm-symbolizer for readable reports.
      - name: clang runtime
        run: sudo apt-get install -y --no-install-recommends libclang-rt-18-dev llvm-18
      # The runner kernel's ASLR entropy is too high for TSan's memory layout.
      - name: ASLR entropy for TSan
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Tests under address sanitizer
        if: matrix.sanitizer == 'address'
        run: scripts/san.sh address
      # Every race, not only the first, and a de-duplicated list in the job summary for triage.
      - name: Tests under thread sanitizer (report-only)
        if: matrix.sanitizer == 'thread'
        env:
          TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1
        run: |
          set -o pipefail
          scripts/san.sh thread --no-fail-fast 2>&1 | tee target/tsan.log
      - name: TSan race summary
        if: always() && matrix.sanitizer == 'thread'
        run: |
          {
            echo "### ThreadSanitizer reports (distinct locations)"
            echo '```'
            grep -h '^SUMMARY: ThreadSanitizer' target/tsan.log | sed 's#/home/runner/work/[^ ]*/##' | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The socket tests are timing-sensitive; one green run proves little (R-P0-8).
  socket-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Socket tests, 20 runs
        run: scripts/test-loop.sh 20

  # libquickfix must come from our fork's krx/main (KRX_FORK_NOTES.md).
  submodule-pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Submodule commit is on gianghn/quickfix krx/main
        run: scripts/check-submodule-pin.sh
